# Deploys https://jayyidautos.com to Namecheap shared hosting (cPanel).
#
#   1. tests     - the full test suite must pass, or nothing is deployed
#   2. deploy    - builds production dependencies, uploads changed files with rsync over SSH,
#                  runs migrations and rebuilds Laravel's caches, then checks the live site
#
# SSH needs shell access on the cPanel account (Namecheap support enables it).
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   CPANEL_HOST        server hostname, e.g. server123.web-hosting.com (or jayyidautos.com)
#   CPANEL_USERNAME    cPanel username (the main account: SSH must be enabled for it)
#   CPANEL_PASSWORD    cPanel password
#   CPANEL_REMOTE_DIR  app folder relative to your home folder, e.g. jayyidautos/
#                      (an absolute /home/<user>/jayyidautos/ also works)
# Optional repository variable:
#   CPANEL_SSH_PORT    defaults to 21098, Namecheap's SSH port
#
# The server keeps its own .env, uploaded photos and logs: they are never
# uploaded from here and never deleted by a deploy.

name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a new push waits instead of cutting an upload short.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  PHP_VERSION: '8.3'
  SITE_URL: https://jayyidautos.com

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, fileinfo, gd, pdo_sqlite, sqlite3
          coverage: none

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      # phpunit.xml switches the database to in-memory SQLite and mail to "array".
      - name: Run tests
        run: php artisan test

  deploy:
    name: Deploy to cPanel
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ env.SITE_URL }}

    steps:
      - name: Check deployment secrets
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
          CPANEL_PASSWORD: ${{ secrets.CPANEL_PASSWORD }}
          CPANEL_REMOTE_DIR: ${{ secrets.CPANEL_REMOTE_DIR }}
        run: |
          missing=0
          for name in CPANEL_HOST CPANEL_USERNAME CPANEL_PASSWORD CPANEL_REMOTE_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set."
              missing=1
            fi
          done
          exit "$missing"

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, fileinfo, gd
          coverage: none

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      # No dev tools on the server; the package manifest in bootstrap/cache is rebuilt to match.
      - name: Install production dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction --no-progress

      - name: Install sshpass
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      # rsync paths are relative to the account's home folder. Refuse the home folder itself:
      # it holds every domain on this account, and the app must live in its own folder.
      - name: Resolve remote folder
        id: remote
        env:
          REMOTE_DIR: ${{ secrets.CPANEL_REMOTE_DIR }}
          CPANEL_USERNAME: ${{ secrets.CPANEL_USERNAME }}
        run: |
          dir="${REMOTE_DIR#/}"
          dir="${dir#home/"$CPANEL_USERNAME"/}"
          dir="${dir#./}"
          dir="${dir%/}"
          if [ -z "$dir" ] || [ "$dir" = "." ] || [ "$dir" = "home/$CPANEL_USERNAME" ] || [ "$dir" = "public_html" ]; then
            echo "::error::CPANEL_REMOTE_DIR must be the app's own folder (e.g. jayyidautos/), not the home folder or public_html."
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Check SSH access and create the app folder
        env:
          SSHPASS: ${{ secrets.CPANEL_PASSWORD }}
          SSH_TARGET: ${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT || '21098' }}
          APP_DIR: ${{ steps.remote.outputs.dir }}
        # cPanel answers a login without shell access with a notice and a success code, so the
        # check passes only when the remote side prints the marker at the end.
        run: |
          mkdir -p ~/.ssh
          output=$(sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$SSH_TARGET" \
            "mkdir -p $(printf %q "$APP_DIR") && command -v rsync >/dev/null && echo SSH_READY" 2>&1) || true
          echo "$output"
          if ! grep -q '^SSH_READY$' <<<"$output"; then
            echo "::error::SSH did not run commands on the server. If the output above says shell access is not enabled, ask Namecheap support to enable SSH (shell) access. Otherwise check CPANEL_HOST, CPANEL_USERNAME, CPANEL_PASSWORD and the SSH port ($SSH_PORT)."
            exit 1
          fi

      # One compressed stream; after the first deploy only changed files are sent.
      # Nothing on the server is deleted, so its .env, uploaded photos, logs and sessions stay put.
      # The storage/**/.gitignore placeholders are sent on purpose: they create the storage folders.
      - name: Upload with rsync
        env:
          SSHPASS: ${{ secrets.CPANEL_PASSWORD }}
          SSH_TARGET: ${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT || '21098' }}
          APP_DIR: ${{ steps.remote.outputs.dir }}
        run: |
          rsync -rlptz --checksum --chmod=D755,F644 --stats \
            --exclude=/.git/ \
            --exclude=/.github/ \
            --exclude=/tests/ \
            --exclude=/.env \
            --exclude='/.env.*' \
            --exclude=/.editorconfig \
            --exclude=/.gitattributes \
            --exclude=/phpunit.xml \
            --exclude=/README.md \
            -e "sshpass -e ssh -p $SSH_PORT -o StrictHostKeyChecking=accept-new" \
            ./ "$SSH_TARGET:$APP_DIR/"

      # Same marker rule as the SSH check: success is the last line, not the exit code.
      - name: Run migrations and rebuild caches over SSH
        env:
          SSHPASS: ${{ secrets.CPANEL_PASSWORD }}
          SSH_TARGET: ${{ secrets.CPANEL_USERNAME }}@${{ secrets.CPANEL_HOST }}
          SSH_PORT: ${{ vars.CPANEL_SSH_PORT || '21098' }}
          APP_DIR: ${{ steps.remote.outputs.dir }}
        run: |
          output=$(sshpass -e ssh -p "$SSH_PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 "$SSH_TARGET" \
            "APP_DIR=$(printf %q "$APP_DIR") bash -s" 2>&1 <<'REMOTE'
          set -e
          cd "$HOME/$APP_DIR"

          if [ ! -f .env ]; then
            echo "No .env in $HOME/$APP_DIR. Create it (see .env.example) and re-run this workflow."
            exit 1
          fi

          # Shared hosts carry several PHP builds, and the shell's default "php" may lack the
          # extensions enabled for the website. Use the first 8.2+ build that can reach MySQL.
          PHP=""
          for candidate in php /usr/bin/php /usr/local/bin/php \
            /opt/alt/php85/usr/bin/php /opt/alt/php84/usr/bin/php /opt/alt/php83/usr/bin/php /opt/alt/php82/usr/bin/php \
            /opt/cpanel/ea-php85/root/usr/bin/php /opt/cpanel/ea-php84/root/usr/bin/php \
            /opt/cpanel/ea-php83/root/usr/bin/php /opt/cpanel/ea-php82/root/usr/bin/php; do
            command -v "$candidate" >/dev/null 2>&1 || continue
            if "$candidate" -r 'exit(PHP_VERSION_ID >= 80200 && extension_loaded("pdo_mysql") && extension_loaded("mbstring") ? 0 : 1);' 2>/dev/null; then
              PHP="$candidate"
              break
            fi
            echo "Skipped $candidate: $("$candidate" -r 'echo PHP_VERSION; foreach (["pdo_mysql", "mbstring"] as $e) { if (! extension_loaded($e)) { echo " (no $e)"; } }' 2>/dev/null)"
          done
          if [ -z "$PHP" ]; then
            echo "No PHP 8.2+ with pdo_mysql and mbstring was found for the command line."
            echo "In cPanel > Select PHP Version > Extensions, tick pdo, pdo_mysql (or nd_pdo_mysql) and mbstring, then re-run."
            exit 1
          fi
          echo "Using $PHP"
          "$PHP" -v | head -n 1

          "$PHP" artisan migrate --force
          "$PHP" artisan optimize:clear
          "$PHP" artisan optimize
          echo DEPLOY_FINALIZED
          REMOTE
          ) || true
          echo "$output"
          if ! grep -q '^DEPLOY_FINALIZED$' <<<"$output"; then
            echo "::error::Migrations did not finish on the server. See the output above."
            exit 1
          fi

      - name: Check the live site
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL/up" || true)
            echo "Attempt $attempt: $SITE_URL/up answered HTTP $code"
            if [ "$code" = "200" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SITE_URL/" || true)
              echo "Home page answered HTTP $code"
              [ "$code" = "200" ] && exit 0
            fi
            sleep 10
          done
          echo "::error::$SITE_URL is not answering correctly. Check storage/logs/laravel.log on the server."
          exit 1
